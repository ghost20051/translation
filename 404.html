<title>Translation Revision</title>
<script>
  // Short links: /<site>/subject/sci/learn opens /<site>/#/subject/sci/learn (GitHub Pages serves this page for unknown paths).
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = '/' + (parts.length ? parts[0] + '/' : '');
    var rest = parts.slice(1).join('/');
    location.replace(base + (rest ? '#/' + rest : location.hash));
  })();
</script>
